name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Abhängigkeiten installieren
        run: npm install

      - name: Platzhalter-Icon erstellen (falls kein Icon vorhanden)
        shell: pwsh
        run: |
          if (-not (Test-Path "assets/icon.ico")) {
            New-Item -ItemType Directory -Force -Path assets
            # Kleines 1x1 ICO als Platzhalter
            $bytes = [Convert]::FromBase64String("")
            [IO.File]::WriteAllBytes("assets/icon.ico", $bytes)
          }

      - name: App bauen (Windows NSIS Installer)
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build-Ergebnis anzeigen
        shell: pwsh
        run: Get-ChildItem dist -Recurse | Select-Object FullName, Length

      - name: Installer hochladen
        uses: actions/upload-artifact@v4
        with:
          name: PapierlosesBuero-Windows-Installer
          path: |
            dist/*.exe
            dist/*.msi
          retention-days: 30

      - name: Setup-Datei hochladen
        uses: actions/upload-artifact@v4
        with:
          name: PapierlosesBuero-Setup
          path: dist/
          retention-days: 30
